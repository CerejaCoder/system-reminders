<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
</head>
<body>
    <header class="navbar bg-base-100 shadow-sm flex-wrap m-auto px-7 py-7 gap-3">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl btn-soft">Notificator</a>
        </div>
        <div class="flex flex-wrap gap-2 ">
            <form>
                <input type="text" placeholder="Search" id="search" class="input w-64 lg:w-auto" />
            </form>
            <div class="flex gap-1">
                <label class="swap swap-rotate btn btn-ghost w-10 rounded-full">
                    <input type="checkbox" class="theme-controller" value="dark" />
                    <svg class="swap-off h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"> <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" /> </svg>
                    <svg class="swap-on h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"> <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" /> </svg>
                </label>
                <button class="btn btn-ghost btn-circle" id="notifyIcon">
                    <div class="indicator">
                        <svg aria-label="Notifications" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /> </svg>
                        <span class="badge badge-xs badge-primary indicator-item hidden" id="countReminders"></span>
                    </div>
                </button>
                <button class="btn btn-ghost btn-circle">
                    <div class="indicator" id="logout">
                        <svg aria-label="Export" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12c0 4.97-4.03 9-9 9m0-18c4.97 0 9 4.03 9 9m-9-9c-4.97 0-9 4.03-9 9m0 0c0 4.97 4.03 9 9 9m-3-9h8m0 0l-3-3m3 3l-3 3" /> </svg>
                    </div>
                </button>
            </div>
        </div>
    </header>

    <main class="flex w-4/5 m-auto mt-30 gap-20 flex-col items-center min-h-146">
        <article class="flex flex-col gap-5 justify-center items-center">
            <h1 class="text-5xl">Seja Bem-Vindo ao sistema de lembretes!</h1>

            <p>Opções disponíveis para as notificações</p>

            <div class="join flex-wrap">
                <input class="join-item btn" type="radio" name="options" aria-label="Lista de Notificações" id="radioListReminders" checked />
                <input class="join-item btn" type="radio" name="options" aria-label="Criar Notificação" id="radioCreateReminder" />
            </div>
        </article>

        <article class="flex flex-col justify-center items-center gap-10 w-full" id="mainArticle">

        </article>
    </main>

    <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4 absolute mt-30">
        <aside>
            <p>Copyright © 2026 - Todos os direitos reservados</p>
        </aside>
    </footer>

    <button class="btn hidden" onclick="my_modal_1.showModal()" id="notify"></button>
    <dialog id="my_modal_1" class="modal">
    <div class="modal-box">
        <h3 class="text-lg font-bold titleNotify"></h3>
        <p class="py-4 bodyNotify"></p>
        <div class="modal-action">
        <form method="dialog">
            <button class="btn" id="buttonNotify">Fechar</button>
        </form>
        </div>
    </div>
    </dialog>

    <script src="/pages/index/index.js" type="module"></script>
</body>
</html>
